[project]
name = "maibot-github-subscriber"
version = "1.2.0"
description = "Subscribe to GitHub repositories and push commit, release, issue and PR notifications to MaiBot chats"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "HK560", url = "https://github.com/HK560" },
]
license = { text = "MIT" }
dependencies = [
  "maibot-plugin-sdk>=2.19.0,<3",
  "httpx>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/HK560/Maibot-GitHub-Subscriber"
Issues = "https://github.com/HK560/Maibot-GitHub-Subscriber/issues"

[tool.ruff]
line-length = 120
target-version = "py310"
